<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BKtrd Vision Pro — Scanner Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: #0b0e14;
            color: #e1e6ed;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 450px;
            background: #141822;
            border: 1px solid #232936;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .title {
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
        }
        .status {
            font-size: 12px;
            padding: 4px 10px;
            background: rgba(38, 166, 154, 0.15);
            color: #26a69a;
            border-radius: 20px;
            border: 1px solid #26a69a;
        }
        .card {
            background: #1a1f2c;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            border-left: 4px solid #7b2cbf;
        }
        .pair-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .signal-badge {
            display: inline-block;
            font-size: 14px;
            font-weight: 700;
            padding: 6px 12px;
            border-radius: 6px;
            margin-bottom: 12px;
        }
        .call { background: #26a69a; color: #fff; }
        .put { background: #ef5350; color: #fff; }
        .details {
            font-size: 13px;
            color: #9aa4b2;
            line-height: 1.6;
        }
        .footer {
            text-align: center;
            font-size: 12px;
            color: #5d6675;
            margin-top: 16px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="title">⚡️ BKtrd Vision Pro</div>
        <div class="status">● SCANNER ACTIVE</div>
    </div>

    <div class="card">
        <div class="pair-title">EUR/USD OTC (1m)</div>
        <div class="signal-badge call">CALL ⬆️ (BUY)</div>
        <div class="details">
            <p>• <b>Winrate:</b> 91%</p>
            <p>• <b>Pattern:</b> Bullish Order Block + FVG</p>
            <p>• <b>RSI:</b> 28.4 (Oversold)</p>
        </div>
    </div>

    <div class="footer">
        Powered by Smart Money Concept (SMC) & Price Action
    </div>
</div>

</body>
</html>
